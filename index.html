<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Diary App</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    nav { display: flex; background: #333; color: white; }
    nav button { flex: 1; padding: 15px; border: none; background: #333; color: white; cursor: pointer; }
    nav button:hover { background: #555; }
    .tab { display: none; padding: 20px; }
    .active { display: block; }
    #chatBox { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
    #userInput { width: 80%; padding: 10px; }
    #sendBtn { padding: 10px; }
    textarea { width: 100%; height: 200px; }
  </style>
</head>
<body>
  <nav>
    <button onclick="openTab('chat')">AI Chat</button>
    <button onclick="openTab('entries')">Entries</button>
    <button onclick="openTab('settings')">Settings</button>
  </nav>

  <!-- AI Chat Tab -->
  <div id="chat" class="tab active">
    <h2>AI Chat</h2>
    <div id="chatBox"></div>
    <input type="text" id="userInput" placeholder="Type your message..." />
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>

  <!-- Entries Tab -->
  <div id="entries" class="tab">
    <h2>Diary Entries</h2>
    <textarea id="entryText" placeholder="Write your diary entry here..."></textarea>
    <br><br>
    <button onclick="saveEntry()">Save Entry</button>
    <h3>Saved Entries</h3>
    <ul id="entriesList"></ul>
  </div>

  <!-- Settings Tab -->
  <div id="settings" class="tab">
    <h2>Settings</h2>
    <p>Settings will be added here later.</p>
  </div>

  <script src="app.js"></script>
  <script>
    function openTab(tabId) {
      document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
    }
  </script>
</body>
</html>
